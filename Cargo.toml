[package]
name = "jp-estat-util"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
csv = "1.4.0"
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.7"
futures = "0.3.32"
indicatif = { version = "0.18.6", features = ["tokio"] }
jismesh = "0.3.0"
km-to-sql = "0.1.1"
lazy_static = "1.5.0"
mesh-data-tile = "0.1.1"
reqwest = { version = "0.13.4", features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
url = "2.5.8"

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }
